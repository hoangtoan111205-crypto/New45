
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Grid - SASS</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="page-overlay">
    <div class="gridcontainer">

      <!-- Header -->
      <div class="gridwrapper gridwrapper--header">
        <div class="gridcontent gridcontent--header"></div>
      </div>

      <!-- Main content -->
      <div class="gridwrapper gridwrapper--content">

        <!-- Left sidebar -->
        <div class="gridcontent gridcontent--sidebar">
          <div class="grid-item grid-item--spaced"></div>
          <div class="grid-item grid-item--spaced"></div>
          <div class="grid-item grid-item--spaced"></div>
          <div class="grid-item grid-item--last"></div>
        </div>

        <!-- Empty grid columns -->
        <div class="gridcontent gridcontent--white"></div>
        <div class="gridcontent gridcontent--white"></div>
        <div class="gridcontent gridcontent--white"></div>
        <div class="gridcontent gridcontent--white"></div>
        <div class="gridcontent gridcontent--white"></div>
        <div class="gridcontent gridcontent--white"></div>

        <!-- Right sidebar -->
        <div class="gridcontent gridcontent--sidebar">
          <div class="grid-item grid-item--tall"></div>
        </div>

      </div>

      <!-- Footer -->
      <div class="gridwrapper gridwrapper--footer">
        <div class="gridcontent gridcontent--footer"></div>
      </div>

    </div>
  </div>

  <!-- Background grid -->
  <div class="gridcontainer gridcontainer--faded">
    <div class="gridwrapper gridwrapper--background">
      <div class="gridcontent gridcontent--outlined"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
      <div class="gridcontent gridcontent--outlined-right"></div>
    </div>
  </div>

  <p class="description">
    Resize the browser window to see that this grid will respond to
    the resizing, and always use 100% of the available space.
  </p>

</body>
</html>
